AWSTemplateFormatVersion: "2010-09-09"
Description: Taller AWS DevOps — Semana 2 · Aplicación

# Capa de aplicación del taller: todo lo que ejecuta la imagen y nada más. Es
# la capa que más cambia y la más descartable. Se puede borrar y recrear en
# minutos sin perder nada, porque la red vive en el stack de red, los datos en
# el stack de datos, y el clúster y el balanceador en el de plataforma. Se
# conecta a los tres vía Fn::ImportValue.
#
# Este template es reutilizable: lanzarlo otra vez, con otra imagen, otra ruta,
# y otra prioridad, agrega una segunda aplicación sobre la misma plataforma.
# No hay nada que copiar ni que editar — solo parámetros distintos.

# Solo lo lee el formulario de la consola: agrupa los nueve parámetros y les
# pone etiquetas legibles. El CLI y las APIs lo ignoran.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Imagen de la aplicación" }
        Parameters: [ImageUri, ComandoContenedor]
      - Label: { default: "Stacks de los que depende" }
        Parameters: [RedStackName, DatosStackName, PlataformaStackName]
      - Label: { default: "Lugar en el balanceador compartido" }
        Parameters: [NombreHost, RutaPath, Prioridad, UsarHttps]
    ParameterLabels:
      ImageUri: { default: "URI de la imagen en ECR" }
      ComandoContenedor: { default: "Comando del contenedor" }
      RedStackName: { default: "Stack de red" }
      DatosStackName: { default: "Stack de datos" }
      PlataformaStackName: { default: "Stack de plataforma" }
      NombreHost: { default: "Nombre DNS propio" }
      RutaPath: { default: "Patrón de ruta" }
      Prioridad: { default: "Prioridad de la regla" }
      UsarHttps: { default: "¿Publicar también en HTTPS?" }

Parameters:
  ImageUri:
    Type: String
    Description: URI de la imagen en ECR, con etiqueta.
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+:[a-zA-Z0-9._-]+$'
    ConstraintDescription: >-
      Debe ser un URI de ECR con etiqueta, por ejemplo
      123456789012.dkr.ecr.us-east-1.amazonaws.com/taller-aws-maria:latest

  ComandoContenedor:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Opcional. Comando que ejecuta el contenedor, separado por comas. Vacío
      deja el comando de la imagen, que sirve la plataforma de cursos. Para el
      servidor de eco: courses_server,echo,--name,echo.midominio.com

  RedStackName:
    Type: String
    Description: Nombre del stack de red del que se importan VPC y grupo de seguridad.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]*$'

  DatosStackName:
    Type: String
    Description: Nombre del stack de datos del que se importa la tabla de DynamoDB.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]*$'

  PlataformaStackName:
    Type: String
    Description: Nombre del stack de plataforma del que se importan el clúster y el listener.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]*$'

  NombreHost:
    Type: String
    Default: ""
    Description: >-
      Opcional. Nombre DNS propio de esta aplicación, por ejemplo
      echo.midominio.com. Si se indica, la regla enruta por host y se ignora
      RutaPath. Requiere que el stack de plataforma tenga HTTPS activo, porque
      de ahí salen el comodín en DNS y el certificado.
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Debe quedar vacío, o ser un nombre de dominio en minúsculas.

  RutaPath:
    Type: String
    Default: "/*"
    Description: >-
      Patrón de ruta que esta aplicación atiende en el balanceador compartido.
      "/*" atiende todo; una segunda aplicación usa un prefijo propio. Se ignora
      si se indica NombreHost.

  Prioridad:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 50000
    Description: >-
      Orden de evaluación de la regla en el listener. Se evalúan de menor a
      mayor y gana la primera que coincide, así que la ruta más específica
      lleva el número más bajo. Debe ser única por listener.

  UsarHttps:
    Type: String
    Default: "no"
    AllowedValues: ["si", "no"]
    Description: >-
      Publicar también la regla en el listener 443. Solo si el stack de
      plataforma se desplegó con dominio y hosted zone.

Conditions:
  ConHttps: !Equals [!Ref UsarHttps, "si"]

  # Una lista vacía no se compara con "" directamente: Fn::Join la convierte en
  # la cadena vacía, y ahí sí.
  ConComando: !Not [!Equals [!Join ["", !Ref ComandoContenedor], ""]]

  ConHost: !Not [!Equals [!Ref NombreHost, ""]]

Resources:
  # --- ECS: servicio y task definition ---

  # El clúster no está aquí: lo comparten todas las aplicaciones, y por eso
  # vive en el stack de plataforma.
  ServicioApp:
    Type: AWS::ECS::Service
    # El target group debe estar asociado al balanceador antes de que ECS cree
    # el servicio, y quien lo asocia es la regla del listener. Sin esto, el
    # stack falla de manera intermitente.
    DependsOn: ReglaHTTP
    Properties:
      Cluster:
        Fn::ImportValue: !Sub "${PlataformaStackName}-cluster-nombre"
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref TareaApp
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub "${RedStackName}-subred-a-id"
            - Fn::ImportValue: !Sub "${RedStackName}-subred-b-id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${RedStackName}-sg-servicio-id"
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref GrupoDestino

  TareaApp:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt RolEjecucion.Arn
      TaskRoleArn: !GetAtt RolTarea.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          # Una imagen, varias aplicaciones: el comando decide cuál. Vacío deja
          # el CMD del Dockerfile, y AWS::NoValue borra la propiedad entera en
          # vez de mandar una lista vacía, que ECS rechazaría.
          Command: !If
            - ConComando
            - !Ref ComandoContenedor
            - !Ref AWS::NoValue
          PortMappings:
            - ContainerPort: 8080
          # Configuración de la aplicación. Dos variables están ausentes a
          # propósito:
          #  - CB_APPS_SECRET: un secreto nunca va en texto plano en un
          #    template. Se agrega en la Semana 2 vía Secrets Manager
          #    (`Secrets` + `ValueFrom`). Sin él, los handlers corren abiertos
          #    aunque CB_APPS_GATED diga `all`.
          #  - CB_HOOK_TOKEN: mismo motivo; solo lo necesita el servidor del
          #    instructor que recibe los webhooks de SNS.
          # CB_DEV_ROOT es solo para desarrollo local y no se define aquí.
          Environment:
            - Name: PORT
              Value: "8080"
            - Name: CB_APPS_TABLE
              Value:
                Fn::ImportValue: !Sub "${DatosStackName}-tabla-nombre"
            - Name: CB_APPS_PUBLIC_COLLECTIONS
              Value: counters
            - Name: CB_APPS_GATED
              Value: all
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GrupoLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  GrupoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 7

  # --- Roles de IAM ---

  # Rol de ejecución: lo usa ECS para descargar la imagen y escribir logs.
  RolEjecucion:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Rol de tarea: lo usa la aplicación dentro del contenedor.
  RolTarea:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: acceso-tabla-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  Fn::ImportValue: !Sub "${DatosStackName}-tabla-arn"
        - PolicyName: publicar-metricas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                # PutMetricData no acepta un ARN como recurso; el namespace es
                # la forma de acotar el permiso.
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Taller/Custom

  # --- Lugar de esta aplicación en el balanceador compartido ---

  # El balanceador no está aquí, pero el target group sí: describe a *esta*
  # aplicación —su puerto, su health check— y se borra con ella.
  GrupoDestino:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${RedStackName}-vpc-id"
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"

  # La regla es el contrato inverso: en vez de importar un valor, esta
  # aplicación *agrega* algo al listener de la plataforma. Es lo que permite
  # que varias aplicaciones compartan un solo ALB.
  #
  # Enruta de una de dos formas, según los parámetros: por nombre de host, si la
  # aplicación tiene subdominio propio, o por prefijo de ruta. Son excluyentes a
  # propósito — mezclarlas en una misma regla exige que se cumplan las dos.
  ReglaHTTP:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub "${PlataformaStackName}-listener-http-arn"
      Priority: !Ref Prioridad
      Conditions:
        - !If
          - ConHost
          - Field: host-header
            HostHeaderConfig:
              Values: [!Ref NombreHost]
          - Field: path-pattern
            PathPatternConfig:
              Values: [!Ref RutaPath]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrupoDestino

  ReglaHTTPS:
    Condition: ConHttps
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub "${PlataformaStackName}-listener-https-arn"
      Priority: !Ref Prioridad
      Conditions:
        - !If
          - ConHost
          - Field: host-header
            HostHeaderConfig:
              Values: [!Ref NombreHost]
          - Field: path-pattern
            PathPatternConfig:
              Values: [!Ref RutaPath]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrupoDestino

# La URL ya no sale de aquí: el nombre DNS pertenece al balanceador compartido,
# y se lee en el output UrlBase del stack de plataforma. Este stack solo publica
# qué ruta atiende, y su target group, para que un add-on pueda enviarle tráfico
# sin modificarlo — el mismo motivo por el que el stack monolítico de la Semana 1
# exportaba el suyo.
Outputs:
  RutaAtendida:
    Description: Cómo llega el tráfico a esta aplicación en el balanceador compartido
    Value: !If
      - ConHost
      - !Sub "host ${NombreHost}"
      - !Sub "ruta ${RutaPath}"

  GrupoDestinoArn:
    Description: ARN del grupo de destino de esta aplicación
    Value: !Ref GrupoDestino
    Export:
      Name: !Sub "${AWS::StackName}-grupo-destino-arn"
