AWSTemplateFormatVersion: "2010-09-09"
Description: Taller AWS DevOps · Semana 3 · Aplicación con health checks de tres niveles

# Es el template de aplicación de la Semana 2, con una sola diferencia: los
# health checks dejan de ser una ruta decorativa, y pasan a estar cableados en
# los tres lugares donde AWS pregunta por la salud de una tarea.
#
# Se despliega como actualización del mismo stack de la Semana 2. El change set
# muestra exactamente qué cambia, y esa lista corta es el material de la clase:
#
#   1. El target group consulta /health/ready, no /health.
#   2. El chequeo de contenedor apunta a /health/live, no a /health.
#   3. El período de gracia del servicio cubre el arranque.
#   4. La aplicación drena antes de apagarse, y ECS le da tiempo de hacerlo.
#
# El chequeo de contenedor ya existía en la Semana 2, contra /health, con el
# mismo comando. Lo que cambia acá no es el mecanismo, sino la pregunta: /health
# solo dice si el proceso contesta; /health/live dice si además está sano.
#
# Los números no son decorativos: están encadenados entre sí. La sección
# "Presupuesto de tiempo" más abajo explica de dónde sale cada uno.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Imagen de la aplicación" }
        Parameters: [ImageUri, ComandoContenedor]
      - Label: { default: "Stacks de los que depende" }
        Parameters: [RedStackName, DatosStackName, PlataformaStackName]
      - Label: { default: "Lugar en el balanceador compartido" }
        Parameters: [NombreHost, RutaPath, Prioridad, UsarHttps]
      - Label: { default: "Health checks" }
        Parameters: [RutaSaludBalanceador, RutaSaludContenedor, SegundosDrenaje]
    ParameterLabels:
      ImageUri: { default: "URI de la imagen en ECR" }
      ComandoContenedor: { default: "Comando del contenedor" }
      RedStackName: { default: "Stack de red" }
      DatosStackName: { default: "Stack de datos" }
      PlataformaStackName: { default: "Stack de plataforma" }
      NombreHost: { default: "Nombre DNS propio" }
      RutaPath: { default: "Patrón de ruta" }
      Prioridad: { default: "Prioridad de la regla" }
      UsarHttps: { default: "¿Publicar también en HTTPS?" }
      RutaSaludBalanceador: { default: "Ruta que consulta el balanceador" }
      RutaSaludContenedor: { default: "Ruta que consulta ECS" }
      SegundosDrenaje: { default: "Segundos de drenaje" }

Parameters:
  ImageUri:
    Type: String
    Description: URI de la imagen en ECR, con etiqueta.
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+:[a-zA-Z0-9._-]+$'
    ConstraintDescription: >-
      Debe ser un URI de ECR con etiqueta, por ejemplo
      123456789012.dkr.ecr.us-east-1.amazonaws.com/taller-aws-maria:latest

  ComandoContenedor:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Opcional. Comando que ejecuta el contenedor, separado por comas. Vacío
      deja el comando de la imagen, que sirve la plataforma de cursos. Para el
      servidor de eco: courses_server,echo,--name,echo.midominio.com

  RedStackName:
    Type: String
    Description: Nombre del stack de red del que se importan VPC y grupo de seguridad.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]*$'

  DatosStackName:
    Type: String
    Description: Nombre del stack de datos del que se importa la tabla de DynamoDB.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]*$'

  PlataformaStackName:
    Type: String
    Description: Nombre del stack de plataforma del que se importan el clúster y el listener.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]*$'

  NombreHost:
    Type: String
    Default: ""
    Description: >-
      Opcional. Nombre DNS propio de esta aplicación, por ejemplo
      echo.midominio.com. Si se indica, la regla enruta por host y se ignora
      RutaPath. Requiere que el stack de plataforma tenga HTTPS activo, porque
      de ahí salen el comodín en DNS y el certificado.
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Debe quedar vacío, o ser un nombre de dominio en minúsculas.

  RutaPath:
    Type: String
    Default: "/*"
    Description: >-
      Patrón de ruta que esta aplicación atiende en el balanceador compartido.
      "/*" atiende todo; una segunda aplicación usa un prefijo propio. Se ignora
      si se indica NombreHost.

  Prioridad:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 50000
    Description: >-
      Orden de evaluación de la regla en el listener. Se evalúan de menor a
      mayor y gana la primera que coincide, así que la ruta más específica
      lleva el número más bajo. Debe ser única por listener.

  UsarHttps:
    Type: String
    Default: "no"
    AllowedValues: ["si", "no"]
    Description: >-
      Publicar también la regla en el listener 443. Solo si el stack de
      plataforma se desplegó con dominio y hosted zone.

  # --- Parámetros nuevos de la Semana 3 ---

  # Los tres son parámetros, y no valores fijos, porque no toda aplicación
  # implementa los tres niveles. El servidor de eco solo tiene /health, así que
  # se despliega con RutaSaludBalanceador=/health y RutaSaludContenedor vacío.
  RutaSaludBalanceador:
    Type: String
    Default: /health/ready
    Description: >-
      Ruta que consulta el target group. Debe ser la de readiness: una falla
      saca la tarea de rotación, sin matarla. Para una aplicación que solo
      tiene la ruta clásica, se indica /health.
    AllowedPattern: '^/[A-Za-z0-9._~%!$&()*+,;=:@/-]*$'
    ConstraintDescription: Debe empezar con /.

  RutaSaludContenedor:
    Type: String
    Default: /health/live
    Description: >-
      Ruta que consulta ECS dentro del contenedor. Debe ser la de liveness: una
      falla reemplaza la tarea. Vacío desactiva el chequeo de contenedor, que es
      lo correcto para una aplicación que no distingue liveness de readiness.
    AllowedPattern: '^$|^/[A-Za-z0-9._~%!$&()*+,;=:@/-]*$'
    ConstraintDescription: Debe quedar vacío, o empezar con /.

  SegundosDrenaje:
    Type: Number
    Default: 25
    MinValue: 0
    MaxValue: 100
    Description: >-
      Tiempo que la aplicación responde 503 en readiness después de recibir
      SIGTERM, antes de cerrar conexiones. Debe superar el tiempo que tarda el
      balanceador en dar de baja el destino, que aquí es intervalo (10) por
      umbral (2), o sea 20 segundos. 0 desactiva el drenaje.

Conditions:
  ConHttps: !Equals [!Ref UsarHttps, "si"]

  # Una lista vacía no se compara con "" directamente: Fn::Join la convierte en
  # la cadena vacía, y ahí sí.
  ConComando: !Not [!Equals [!Join ["", !Ref ComandoContenedor], ""]]

  ConHost: !Not [!Equals [!Ref NombreHost, ""]]

  ConChequeoContenedor: !Not [!Equals [!Ref RutaSaludContenedor, ""]]

Resources:
  # --- ECS: servicio y task definition ---

  ServicioApp:
    Type: AWS::ECS::Service
    DependsOn: ReglaHTTP
    Properties:
      Cluster:
        Fn::ImportValue: !Sub "${PlataformaStackName}-cluster-nombre"
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref TareaApp
      # Ventana en la que el servicio ignora los reportes del balanceador. Cubre
      # el arranque: sin ella, una tarea que tarda en levantar se da de baja, y
      # se reemplaza, antes de haber atendido su primer pedido. Supera el
      # StartPeriod del chequeo de contenedor a propósito; el que manda debe ser
      # el chequeo más informado, no el reloj del servicio.
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub "${RedStackName}-subred-a-id"
            - Fn::ImportValue: !Sub "${RedStackName}-subred-b-id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${RedStackName}-sg-servicio-id"
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref GrupoDestino

  TareaApp:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt RolEjecucion.Arn
      TaskRoleArn: !GetAtt RolTarea.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Command: !If
            - ConComando
            - !Ref ComandoContenedor
            - !Ref AWS::NoValue
          PortMappings:
            - ContainerPort: 8080

          # Nivel 1 de 3: liveness. Lo corre ECS, adentro del contenedor, sin
          # pasar por la red de la VPC. Si falla, la tarea se detiene, y el
          # servicio levanta otra.
          #
          # El comando es el propio binario, con un subcomando que pide la ruta
          # por loopback, y traduce la respuesta a un código de salida. Evita
          # instalar curl solo para esto: cada paquete extra en la imagen es
          # superficie de ataque, y peso en cada despliegue.
          HealthCheck: !If
            - ConChequeoContenedor
            - Command:
                - CMD
                - courses_server
                - healthcheck
                - --path
                - !Ref RutaSaludContenedor
              Interval: 15
              Timeout: 5
              Retries: 3
              # Ventana de arranque. Los fallos de acá adentro no cuentan, y
              # tampoco consumen reintentos. Es la respuesta de ECS al problema
              # de una aplicación que tarda en estar lista.
              StartPeriod: 60
            - !Ref AWS::NoValue

          # Cuánto espera ECS entre el SIGTERM, y el SIGKILL, y debe superar el
          # drenaje, más la última petición en curso. En la Semana 2 alcanzaban
          # 30, porque no había drenaje. Si es menor, el drenaje se corta a la
          # mitad, y el trabajo de arriba no sirve de nada. El máximo en
          # Fargate es 120.
          StopTimeout: 60

          Environment:
            - Name: PORT
              Value: "8080"
            - Name: CB_APPS_TABLE
              Value:
                Fn::ImportValue: !Sub "${DatosStackName}-tabla-nombre"
            - Name: CB_APPS_PUBLIC_COLLECTIONS
              Value: counters
            - Name: CB_APPS_GATED
              Value: all
            # Las tres rutas vienen apagadas en la imagen. Esta variable es la
            # que las publica; sin ella, /health/ready responde 404, y el target
            # group da la tarea por muerta.
            - Name: CB_HEALTH_CHECKS
              Value: "1"
            # Cada cuánto verifica sus dependencias la tarea de fondo. Es
            # independiente del intervalo del balanceador: el endpoint contesta
            # de memoria, así que veinte tareas no golpean DynamoDB veinte veces
            # por chequeo.
            - Name: CB_HEALTH_INTERVAL_SECS
              Value: "5"
            - Name: CB_HEALTH_TIMEOUT_MS
              Value: "2000"
            - Name: CB_HEALTH_DRAIN_SECS
              Value: !Ref SegundosDrenaje
            - Name: CB_HOOK_TOKEN
              Value: cloudbridge
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GrupoLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  GrupoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 7

  # --- Roles de IAM ---

  RolEjecucion:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  RolTarea:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: acceso-tabla-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource:
                  Fn::ImportValue: !Sub "${DatosStackName}-tabla-arn"
        - PolicyName: publicar-metricas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Taller/Custom

  # --- Lugar de esta aplicación en el balanceador compartido ---

  # Nivel 2 de 3: readiness. Lo consulta el balanceador, por la red, contra la
  # IP privada de la tarea. Si falla, la tarea sale de rotación, y sigue viva.
  #
  # Presupuesto de tiempo, que es de donde salen los números de este bloque:
  #
  #   detectar la falla   = Interval (10) × UnhealthyThreshold (2) = 20 s
  #   drenar              = SegundosDrenaje, 25 por defecto, mayor que 20
  #   vaciar en vuelo     = deregistration_delay = 15 s
  #   margen antes del kill = StopTimeout (60) > 25 + cola de peticiones
  #
  # Bajar el intervalo detecta antes, y cuesta más chequeos por minuto. Subir el
  # umbral tolera mejor un pico aislado, y demora la baja. Cambiar uno obliga a
  # revisar SegundosDrenaje, porque el drenaje solo sirve si dura más que la
  # detección.
  GrupoDestino:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${RedStackName}-vpc-id"
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: !Ref RutaSaludBalanceador
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      # Explícito a propósito. El default también es 200, pero acá se lee que
      # una dependencia blanda caída sigue siendo 200, con el detalle en el
      # cuerpo, y por eso la tarea no sale de rotación.
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"

  ReglaHTTP:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub "${PlataformaStackName}-listener-http-arn"
      Priority: !Ref Prioridad
      Conditions:
        - !If
          - ConHost
          - Field: host-header
            HostHeaderConfig:
              Values: [!Ref NombreHost]
          - Field: path-pattern
            PathPatternConfig:
              Values: [!Ref RutaPath]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrupoDestino

  ReglaHTTPS:
    Condition: ConHttps
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub "${PlataformaStackName}-listener-https-arn"
      Priority: !Ref Prioridad
      Conditions:
        - !If
          - ConHost
          - Field: host-header
            HostHeaderConfig:
              Values: [!Ref NombreHost]
          - Field: path-pattern
            PathPatternConfig:
              Values: [!Ref RutaPath]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrupoDestino

Outputs:
  RutaAtendida:
    Description: Cómo llega el tráfico a esta aplicación en el balanceador compartido
    Value: !If
      - ConHost
      - !Sub "host ${NombreHost}"
      - !Sub "ruta ${RutaPath}"

  GrupoDestinoArn:
    Description: ARN del grupo de destino de esta aplicación
    Value: !Ref GrupoDestino
    Export:
      Name: !Sub "${AWS::StackName}-grupo-destino-arn"

  ChequeosDeSalud:
    Description: Qué ruta consulta cada nivel, y cuánto dura el drenaje
    Value: !Sub
      - "balanceador ${RutaSaludBalanceador} · contenedor ${Contenedor} · drenaje ${SegundosDrenaje}s"
      - Contenedor: !If [ConChequeoContenedor, !Ref RutaSaludContenedor, "sin chequeo"]
